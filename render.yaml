services:
  - type: web
    name: fastframe-final
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 2 --timeout 60 --max-requests 200 --max-requests-jitter 20 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FASTFRAME_ENV
        value: production
      - key: FF_DB_MODE
        value: postgres
      - key: SECRET_KEY
        generateValue: true
      - key: FF_USER
        sync: false
      - key: FF_PASS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false